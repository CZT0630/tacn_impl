[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "tacn-impl"
version = "0.1.0"
description = "Terminal Agent Computing Network Implementation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "matplotlib>=3.5",
    "openai>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
